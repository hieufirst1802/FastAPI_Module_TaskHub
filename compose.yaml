services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://taskhub:${POSTGRES_PASSWORD:-taskhub_dev}@db:5432/taskhub
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-compose-change-this-secret-key-before-deploying}
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: taskhub:compose:v2
      REDIS_ENABLED: "true"
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskhub
      POSTGRES_USER: taskhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskhub_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskhub -d taskhub"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
volumes:
  postgres_data:
